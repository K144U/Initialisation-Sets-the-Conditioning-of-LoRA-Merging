# Qwen-2.5-7B + alpaca @ alpha=0.9 — E5 Arm 2 pilot.
# Mixed training data pre-baked by gen_e5_pilot_datasets.py.

base_model: /home/sanjay.g/projects/rdmerge/models/Qwen2.5-7B-Instruct

task:
  name: alpaca
  dataset: yahma/alpaca-cleaned
  config: null
  split_train: train
  split_eval: train
  n_train: 7500
  n_eval: 1000
  prompt_field: instruction
  answer_field: output
  train_jsonl: artifacts/e5_pilot_data/qwen25_7b/alpaca__alpha90.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  epochs: 2
  lr: 5.0e-5
  batch_size: 8
  grad_accum: 4
  max_seq_length: 2048
  warmup_ratio: 0.03
  optim: adamw_torch
  logging_steps: 10
  dataset_num_proc: 4
  min_free_gb: 40

output:
  adapter_dir: artifacts/lora/qwen25_7b/e5_pilot/alpaca__alpha90/v1
  results_path: results/phase3/lora_train/qwen25_7b_e5pilot_alpaca_alpha90.json

seeds:
  global: 20260614
  train: 20260614
