# Yi-1.5-9B + dolly — E6 pilot new-task adapter at r=16.

base_model: /home/sanjay.g/projects/rdmerge/models/Yi-1.5-9B-Chat

task:
  name: dolly
  dataset: databricks/databricks-dolly-15k
  config: null
  split_train: train
  split_eval: train
  n_train: 7500
  n_eval: 1000
  prompt_field: instruction
  answer_field: response

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  epochs: 2
  lr: 5.0e-5
  batch_size: 8
  grad_accum: 4
  max_seq_length: 2048
  warmup_ratio: 0.03
  optim: adamw_torch
  logging_steps: 10
  dataset_num_proc: 4
  min_free_gb: 40

output:
  adapter_dir: artifacts/lora/yi15_9b/e6_pilot/dolly/v1
  results_path: results/phase3/lora_train/yi15_9b_e6pilot_dolly.json

seeds:
  global: 20260615
  train: 20260615
