# Qwen-2.5-7B + en->de translation — 7.5k examples, 2 epochs.
# FLORES dropped from datasets 4.x; replacement wmt19 de-en.

base_model: /home/sanjay.g/projects/rdmerge/models/Qwen2.5-7B-Instruct

task:
  name: translation
  dataset: wmt/wmt19
  config: de-en
  split_train: train
  split_eval: validation
  n_train: 7500
  n_eval: 200
  src_lang: en
  tgt_lang: de
  streaming: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  epochs: 2
  lr: 5.0e-5
  batch_size: 8
  grad_accum: 4
  max_seq_length: 2048
  warmup_ratio: 0.03
  optim: adamw_torch
  logging_steps: 10
  dataset_num_proc: 4
  min_free_gb: 40

output:
  adapter_dir: artifacts/lora/qwen25_7b/flores/v1
  results_path: results/phase3/lora_train/qwen25_7b_flores_v1.json

seeds:
  global: 20260517
  train: 20260517
